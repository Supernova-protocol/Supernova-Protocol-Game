<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NOVA CORE: Protocol 51</title>
    <style>
        :root {
            --cyan: #00f3ff;
            --purple: #9d4edd;
            --red: #ff0055;
            --bg: #010103;
            --panel: rgba(10, 11, 20, 0.94);
            --gold: #ffbe0b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; color: #d8e2dc; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Top HUD */
        #game-ui { position: absolute; inset: 0; pointer-events: none; display: none; flex-direction: column; justify-content: space-between; padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px; z-index: 10; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .stat-box { background: var(--panel); padding: 10px 15px; border-radius: 12px; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 4px 15px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; min-width: 90px; }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #8892b0; }
        .stat-val { font-size: 18px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 10px rgba(0,243,255,0.6); }

        .level-center { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 50%; }
        .level-text { font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 0 15px var(--purple); letter-spacing: 2px; }
        .bar-wrap { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; border: 1px solid rgba(157, 78, 221, 0.5); position: relative; overflow: hidden; }
        #xp-bar { height: 100%; background: linear-gradient(90deg, var(--purple), var(--cyan)); width: 0%; transition: width 0.2s; }

        /* Bottom Controls */
        .hud-bottom { display: flex; flex-direction: column; align-items: center; gap: 15px; pointer-events: auto; }
        .hp-shield-container { width: 100%; max-width: 300px; height: 14px; background: rgba(0,0,0,0.8); border: 1px solid var(--cyan); border-radius: 7px; position: relative; overflow: hidden; }
        #hp-bar { height: 100%; background: #00f5d4; width: 100%; transition: width 0.2s; }
        #shield-bar { position: absolute; top: 0; left: 0; height: 100%; background: var(--purple); width: 0%; opacity: 0.8; transition: width 0.2s; }
        
        .hub-access-btn { background: linear-gradient(135deg, rgba(10,11,20,0.9), rgba(157,78,221,0.2)); border: 2px solid var(--purple); color: #fff; padding: 15px 30px; border-radius: 12px; font-size: 14px; font-weight: 900; letter-spacing: 2px; box-shadow: 0 5px 20px rgba(157,78,221,0.4); cursor: pointer; transition: transform 0.1s; }
        .hub-access-btn:active { transform: scale(0.95); }

        /* Menus */
        .modal-screen { position: absolute; inset: 0; background: rgba(1, 1, 3, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 50; backdrop-filter: blur(15px); }
        .cyber-card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 18px; padding: 24px; box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 30px rgba(0, 243, 255, 0.1); display: flex; flex-direction: column; gap: 16px; }
        .title-h1 { font-size: 28px; font-weight: 900; text-align: center; letter-spacing: 2px; background: linear-gradient(135deg, var(--cyan), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        .primary-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #7b2cbf, #ff0055); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 900; letter-spacing: 1.5px; cursor: pointer; box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4); }
        .primary-btn:active { transform: scale(0.97); }
        .close-btn { background: #1a1a2e; border: 1px solid #ff0055; box-shadow: none; color: #ff0055; margin-top: 10px; }

        /* Shop Grid */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .shop-item { background: rgba(0,0,0,0.5); border: 1px solid var(--purple); border-radius: 10px; padding: 15px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
        .shop-item:active { background: rgba(157,78,221,0.2); }
        .shop-title { font-size: 12px; font-weight: 800; color: #fff; }
        .shop-cost { font-size: 14px; font-weight: 900; color: var(--cyan); }
        
        /* Draft / Cards */
        #draft-modal { display: none; z-index: 60; }
        .draft-container { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 350px; }
        @keyframes cardDrop { 0% { opacity: 0; transform: translateY(-40px) scale(0.9); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes legendarySpawn { 0% { opacity: 0; transform: translateY(-80px) scale(0.5) rotate(-5deg); filter: brightness(3); } 50% { opacity: 1; transform: translateY(10px) scale(1.05) rotate(2deg); filter: brightness(2); } 100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); filter: brightness(1); } }
        @keyframes legendaryPulse { 0% { box-shadow: 0 0 15px rgba(255, 190, 11, 0.4), inset 0 0 10px rgba(255, 190, 11, 0.1); } 50% { box-shadow: 0 0 35px rgba(255, 190, 11, 0.9), inset 0 0 20px rgba(255, 190, 11, 0.4); } 100% { box-shadow: 0 0 15px rgba(255, 190, 11, 0.4), inset 0 0 10px rgba(255, 190, 11, 0.1); } }
        .draft-card { background: var(--panel); border: 1.5px solid; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 6px; opacity: 0; animation: cardDrop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .draft-card.legendary-card { border-width: 2px; animation: legendarySpawn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, legendaryPulse 2s infinite alternate ease-in-out; }
        .draft-card:active { transform: scale(0.95); }
        .rarity-tag { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; }
        .card-name { font-size: 18px; font-weight: 900; color: #fff; }
        .card-desc { font-size: 13px; color: #8892b0; }
        .card-val { font-size: 14px; font-weight: 800; color: var(--cyan); margin-top: 4px; }
        
        .cyber-input { width: 100%; background: rgba(0,0,0,0.6); border: 2px solid var(--purple); border-radius: 10px; padding: 16px; font-size: 18px; color: #fff; text-align: center; outline: none; }
        .cyber-input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }

        .leaderboard-table { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .lb-item { display: flex; justify-content: space-between; padding: 12px 14px; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 14px; font-weight: 800; }
        .lb-item.gold { color: var(--gold); border-left: 4px solid var(--gold); background: rgba(255,190,11,0.1); }
        .lb-item.silver { color: #e0e1dd; border-left: 4px solid #e0e1dd; }
        .lb-item.bronze { color: #f77f00; border-left: 4px solid #f77f00; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- In-Game HUD -->
    <div id="game-ui">
        <div class="hud-top">
            <div class="stat-box">
                <span class="stat-label">Shards</span>
                <span class="stat-val" id="hud-shards">0</span>
            </div>
            <div class="level-center">
                <div class="level-text">LEVEL <span id="hud-level">1</span></div>
                <div class="bar-wrap"><div id="xp-bar"></div></div>
            </div>
            <div class="stat-box">
                <span class="stat-label">Score</span>
                <span class="stat-val" id="hud-score">0</span>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="hp-shield-container">
                <div id="hp-bar"></div>
                <div id="shield-bar"></div>
            </div>
            <button class="hub-access-btn" onclick="openShop()">[ ACCESS UPGRADE HUB ]</button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="modal-screen" style="display: none;">
        <div class="cyber-card">
            <h1 class="title-h1">UPGRADE HUB</h1>
            <div style="text-align: center; color: var(--cyan); font-weight: 900; font-size: 18px;">
                Verfügbare Shards: <span id="shop-shards-display">0</span>
            </div>
            <div class="shop-grid">
                <div class="shop-item" onclick="buyCoreUpgrade('dmg')"><span class="shop-title">FORCE DAMAGE</span><span class="shop-cost" id="cost-dmg">50</span></div>
                <div class="shop-item" onclick="buyCoreUpgrade('rate')"><span class="shop-title">OVERCLOCK</span><span class="shop-cost" id="cost-rate">80</span></div>
                <div class="shop-item" onclick="buyCoreUpgrade('shield')"><span class="shop-title">AEGIS SHIELD</span><span class="shop-cost" id="cost-shield">150</span></div>
                <div class="shop-item" onclick="buyCoreUpgrade('multi')"><span class="shop-title">SPLIT VECTOR</span><span class="shop-cost" id="cost-multi">300</span></div>
            </div>
            <button class="primary-btn close-btn" onclick="closeShop()">ZURÜCK ZUM GEFECHT</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-screen">
        <div class="cyber-card">
            <h1 class="title-h1">NOVA CORE</h1>
            <input type="text" id="player-input" class="cyber-input" placeholder="CALLSIGN EINGEBEN" maxlength="12" autocomplete="off">
            <button class="primary-btn" onclick="saveNameAndGoToHub()">SYSTEM STARTEN</button>
        </div>
    </div>

    <!-- Hub Modal -->
    <div id="hub-modal" class="modal-screen" style="display: none;">
        <div class="cyber-card">
            <h1 class="title-h1">COMMAND HUB</h1>
            <div style="display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                <span>Operator: <strong id="hub-username" style="color:var(--cyan)">-</strong></span>
                <span>Highscore: <strong id="hub-bestscore" style="color:var(--gold)">0</strong></span>
            </div>
            <div class="leaderboard-table" id="hub-lb-rows"></div>
            <button class="primary-btn" onclick="startCombat()" style="margin-top: 10px;">ENTER GRID (START)</button>
        </div>
    </div>

    <!-- Draft Modal -->
    <div id="draft-modal" class="modal-screen">
        <h2 style="color: #fff; font-size: 22px; font-weight: 900; margin-bottom: 20px; letter-spacing: 2px; text-shadow: 0 0 10px var(--cyan);" id="draft-headline">ROGUELITE DRAFT</h2>
        <div class="draft-container" id="draft-card-list"></div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="modal-screen" style="display: none;">
        <div class="cyber-card" style="text-align: center;">
            <h1 class="title-h1" style="background: var(--red); -webkit-background-clip: text;">CORE BREACH</h1>
            <div style="font-size: 32px; font-weight: 900; color: #fff; margin: 15px 0;">Score: <span id="final-score-val">0</span></div>
            <button class="primary-btn" onclick="returnToHubFromDefeat()">ZURÜCK ZUM HUB</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let isTouching = false; let aimX = 0, aimY = 0;
        let animId;
        
        // Starfield
        let stars = [];
        function initStars() {
            stars = [];
            for(let i=0; i<150; i++) {
                stars.push({ x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight, s: Math.random()*1.5+0.5, v: Math.random()*0.8+0.2 });
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight;
            centerX = width / 2; centerY = height / 2;
            if (!isTouching) { aimX = centerX; aimY = centerY - 150; }
            initStars();
        }
        window.addEventListener('resize', resize); resize();

        // Audio Engine
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ac = getAudioContext(); const now = ac.currentTime;
                const osc = ac.createOscillator(); const gain = ac.createGain();

                if (type === 'laser') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(650, now); osc.frequency.exponentialRampToValueAtTime(120, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(40, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
                } else if (type === 'boss_spawn') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(90, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.6);
                    gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.6);
                } else if (type === 'upgrade') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(900, now + 0.25);
                    gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
                } else if (type === 'shatter') {
                    // Epischer tiefer Bass-Schlag für den Screen Shatter
                    osc.type = 'square'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(10, now + 1.2);
                    gain.gain.setValueAtTime(0.6, now); gain.gain.linearRampToValueAtTime(0.001, now + 1.2);
                }
                osc.connect(gain); gain.connect(ac.destination);
                osc.start(now); osc.stop(now + 1.5);
            } catch (e) {}
        }

        // Leaderboard Logic
        let playerName = localStorage.getItem('nova_username') || '';
        let highscore = parseInt(localStorage.getItem('nova_highscore') || '0');
        let leaderboard = JSON.parse(localStorage.getItem('nova_lb') || 'null') || [ { name: "Satoshi", score: 25400 }, { name: "Vanguard", score: 18100 }, { name: "Cipher", score: 12500 }, { name: "Node_07", score: 8200 }, { name: "Operator_1", score: 4400 } ];

        function saveNameAndGoToHub() {
            const input = document.getElementById('player-input'); const val = input.value.trim();
            if (val.length < 2) return alert("Callsign benötigt mindestens 2 Zeichen.");
            playerName = val.toUpperCase(); localStorage.setItem('nova_username', playerName);
            document.getElementById('login-modal').style.display = 'none'; openHub();
        }

        function openHub() {
            document.getElementById('hub-modal').style.display = 'flex';
            document.getElementById('hub-username').innerText = playerName; document.getElementById('hub-bestscore').innerText = highscore;
            const list = document.getElementById('hub-lb-rows'); list.innerHTML = ''; leaderboard.sort((a,b) => b.score - a.score);
            leaderboard.slice(0, 5).forEach((entry, i) => {
                const item = document.createElement('div'); item.className = `lb-item ${i===0?'gold':i===1?'silver':i===2?'bronze':''}`;
                item.innerHTML = `<span>#${i+1} ${entry.name}</span><span>${entry.score}</span>`; list.appendChild(item);
            });
        }

        function registerScore(sc) {
            if (sc > highscore) { highscore = sc; localStorage.setItem('nova_highscore', highscore); }
            leaderboard.push({ name: playerName, score: sc }); leaderboard.sort((a,b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 5); localStorage.setItem('nova_lb', JSON.stringify(leaderboard));
        }

        // Game State
        let inCombat = false; let isPaused = false; 
        let isShattering = false; let shatterFrames = 0;
        let frame = 0; let score = 0; let shards = 0; let xp = 0; let xpReq = 100; let level = 1; let ascension = 0;
        let player = { hp: 100, maxHp: 100, shield: 0, maxShield: 0, regen: 0.05, dmg: 20, fireDelay: 10, lastFire: 0, multi: 1 };
        let shopCosts = { dmg: 50, rate: 80, shield: 150, multi: 300 };
        let bullets = []; let enemies = []; let particles = []; let boss = null;

        // Input
        function setAim(x, y) { aimX = x; aimY = y; }
        window.addEventListener('touchstart', (e) => { if (!inCombat || isPaused || isShattering) return; isTouching = true; setAim(e.touches[0].clientX, e.touches[0].clientY); getAudioContext(); }, { passive: false });
        window.addEventListener('touchmove', (e) => { if (!inCombat || isPaused || isShattering) return; setAim(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
        window.addEventListener('touchend', () => { isTouching = false; });
        window.addEventListener('mousedown', (e) => { if (!inCombat || isPaused || isShattering) return; isTouching = true; setAim(e.clientX, e.clientY); getAudioContext(); });
        window.addEventListener('mousemove', (e) => { if (!inCombat || isPaused || isShattering) return; setAim(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { isTouching = false; });

        function getTargetCoordinates() {
            if (isTouching) return { x: aimX, y: aimY };
            if (boss) return { x: boss.x, y: boss.y };
            if (enemies.length > 0) {
                let closest = null; let minDist = Infinity;
                for (let e of enemies) {
                    let d = Math.hypot(e.x - centerX, e.y - centerY);
                    if (d < minDist) { minDist = d; closest = e; }
                }
                if (closest) return { x: closest.x, y: closest.y };
            }
            return { x: centerX, y: centerY - 150 };
        }

        function fireProjectiles() {
            if (frame - player.lastFire < player.fireDelay) return;
            player.lastFire = frame; playSound('laser');
            const target = getTargetCoordinates(); const angle = Math.atan2(target.y - centerY, target.x - centerX);
            const spread = 0.16; const count = player.multi; const startAng = angle - ((count - 1) * spread) / 2;
            for (let i = 0; i < count; i++) {
                const a = startAng + (i * spread);
                bullets.push({ x: centerX + Math.cos(a) * 36, y: centerY + Math.sin(a) * 36, vx: Math.cos(a) * 16, vy: Math.sin(a) * 16, dmg: player.dmg, life: 80 });
            }
        }

        function createExplosion(x, y, color, count=12) {
            for(let i=0; i<count; i++) {
                const a = Math.random() * Math.PI * 2; const s = Math.random() * 5 + 2;
                particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 20 + Math.random() * 25, color: color });
            }
        }

        // Ascension / Evolution Check
        function getAscensionLevel(lvl) {
            if (lvl >= 50) return 5;
            if (lvl >= 35) return 4;
            if (lvl >= 25) return 3;
            if (lvl >= 10) return 2;
            if (lvl >= 5) return 1;
            return 0;
        }

        // Roguelite & Shop
        const SKILLS = [
            { id: 'dmg', name: 'Vector Surge', desc: 'Smarter Plasma-Boost' },
            { id: 'rate', name: 'Quantum CPU', desc: 'Erhöht Schussfrequenz' },
            { id: 'shield', name: 'Aegis Node', desc: 'Verstärkt Schildnetzwerk' },
            { id: 'multi', name: 'Split Matrix', desc: 'Zusätzlicher Datenvektor' }
        ];
        const RARITIES = [ { name: "Common", col: "#8892b0", mult: 1 }, { name: "Uncommon", col: "#00f5d4", mult: 1.5 }, { name: "Epic", col: "#9d4edd", mult: 2.2 }, { name: "Legendary", col: "#ffbe0b", mult: 3.5 } ];

        function triggerDraft() {
            isPaused = true;
            const modal = document.getElementById('draft-modal');
            const list = document.getElementById('draft-card-list');
            list.innerHTML = ''; modal.style.display = 'flex';
            let pool = [...SKILLS].sort(() => 0.5 - Math.random()).slice(0, 3);
            
            pool.forEach((sk, index) => {
                let rIdx = level >= 10 ? 3 : (level >= 5 ? 2 : (Math.random() > 0.65 ? 1 : 0));
                let r = RARITIES[rIdx];
                let card = document.createElement('div'); card.className = 'draft-card'; card.style.borderColor = r.col; card.style.animationDelay = `${index * 0.15}s`;

                if (r.name === 'Legendary') {
                    card.classList.add('legendary-card'); if(index === 0) playSound('boss_spawn'); 
                } else {
                    let glowSpread = 5 + (rIdx * 10); card.style.boxShadow = `0 8px 24px rgba(0,0,0,0.6), 0 0 ${glowSpread}px ${r.col}44`;
                }

                card.innerHTML = `<span class="rarity-tag" style="color: ${r.col};">${r.name}</span><span class="card-name">${sk.name}</span><span class="card-desc">${sk.desc}</span><span class="card-val">+${Math.round(25 * r.mult)}% BOOST</span>`;
                
                card.onclick = () => {
                    if (sk.id === 'dmg') player.dmg = Math.round(player.dmg * (1 + 0.25 * r.mult));
                    if (sk.id === 'rate') player.fireDelay = Math.max(3, Math.round(player.fireDelay * 0.82));
                    if (sk.id === 'shield') { player.maxShield += Math.round(30 * r.mult); player.shield = player.maxShield; }
                    if (sk.id === 'multi') player.multi += 1;
                    playSound('upgrade'); modal.style.display = 'none'; isPaused = false; updateHUD();
                };
                list.appendChild(card);
            });
        }

        function openShop() { isPaused = true; document.getElementById('shop-shards-display').innerText = shards; document.getElementById('shop-modal').style.display = 'flex'; }
        function closeShop() { document.getElementById('shop-modal').style.display = 'none'; isPaused = false; }
        function buyCoreUpgrade(type) {
            if (shards < shopCosts[type]) return;
            shards -= shopCosts[type]; playSound('upgrade');
            if (type === 'dmg') { player.dmg += 8; shopCosts.dmg = Math.round(shopCosts.dmg * 1.6); document.getElementById('cost-dmg').innerText = `${shopCosts.dmg}`; }
            else if (type === 'rate') { player.fireDelay = Math.max(3, player.fireDelay - 1); shopCosts.rate = Math.round(shopCosts.rate * 1.6); document.getElementById('cost-rate').innerText = `${shopCosts.rate}`; }
            else if (type === 'shield') { player.maxShield += 40; player.shield = player.maxShield; shopCosts.shield = Math.round(shopCosts.shield * 1.8); document.getElementById('cost-shield').innerText = `${shopCosts.shield}`; }
            else if (type === 'multi') { player.multi += 1; shopCosts.multi = Math.round(shopCosts.multi * 2.5); document.getElementById('cost-multi').innerText = `${shopCosts.multi}`; }
            document.getElementById('shop-shards-display').innerText = shards; updateHUD();
        }

        function addXP(amount) {
            score += amount; shards += amount; xp += amount;
            if (xp >= xpReq) { level++; xp -= xpReq; xpReq = Math.round(xpReq * 1.4); triggerDraft(); if (level % 5 === 0) spawnBoss(); }
            updateHUD();
        }

        // Enemies & Boss
        function spawnEnemy() {
            if (boss || isPaused || isShattering) return;
            const a = Math.random() * Math.PI * 2; const d = Math.max(width, height) * 0.58 + 40;
            const hp = 12 + (level * 8);
            enemies.push({ x: centerX + Math.cos(a) * d, y: centerY + Math.sin(a) * d, spd: 1.2 + (level * 0.15), hp: hp, maxHp: hp, rad: 14 });
        }

        function spawnBoss() {
            playSound('boss_spawn');
            const hp = 500 + (level * 200);
            boss = { x: centerX, y: centerY - height * 0.42, hp: hp, maxHp: hp, rad: 40, angle: 0 };
        }

        function triggerShatter() {
            isShattering = true; shatterFrames = 0;
            playSound('shatter');
        }

        function takeDamage(dmg) {
            playSound('hit');
            if (player.shield > 0) { player.shield -= dmg; if (player.shield < 0) { player.hp += player.shield; player.shield = 0; } } else { player.hp -= dmg; }
            updateHUD();
            if (player.hp <= 0) {
                inCombat = false; registerScore(score); document.getElementById('game-ui').style.display = 'none';
                document.getElementById('gameover-modal').style.display = 'flex'; document.getElementById('final-score-val').innerText = score;
            }
        }

        function updateHUD() {
            document.getElementById('hud-score').innerText = score; document.getElementById('hud-shards').innerText = shards;
            document.getElementById('hud-level').innerText = level;
            document.getElementById('hp-bar').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
            document.getElementById('shield-bar').style.width = player.maxShield > 0 ? `${(player.shield / player.maxShield) * 100}%` : '0%';
            document.getElementById('xp-bar').style.width = `${(xp / xpReq) * 100}%`;
        }

        function startCombat() {
            document.getElementById('hub-modal').style.display = 'none'; document.getElementById('game-ui').style.display = 'flex';
            score = 0; shards = 0; xp = 0; level = 1; xpReq = 100; ascension = 0;
            player = { hp: 100, maxHp: 100, shield: 0, maxShield: 0, regen: 0.05, dmg: 20, fireDelay: 10, lastFire: 0, multi: 1 };
            shopCosts = { dmg: 50, rate: 80, shield: 150, multi: 300 };
            document.getElementById('cost-dmg').innerText = `50`; document.getElementById('cost-rate').innerText = `80`; document.getElementById('cost-shield').innerText = `150`; document.getElementById('cost-multi').innerText = `300`;
            bullets = []; enemies = []; particles = []; boss = null; isShattering = false; inCombat = true; updateHUD();
        }

        function returnToHubFromDefeat() { document.getElementById('gameover-modal').style.display = 'none'; openHub(); }

        function drawTheCosmicEye() {
            const size = Math.min(width, height) * 0.11; ctx.save(); ctx.translate(centerX, centerY);

            // Ascension 5: The God Core (Giant Spheres)
            if (ascension >= 5) {
                ctx.save(); ctx.rotate(-frame * 0.015);
                for(let i=0; i<4; i++) {
                    ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.ellipse(0, 0, size*3.5, size*0.8, 0, 0, Math.PI*2);
                    ctx.strokeStyle = 'rgba(255, 190, 11, 0.4)'; ctx.lineWidth = 3; ctx.stroke();
                }
                ctx.restore();
            }

            // Ascension 4: Massive rotes Pulsar Feld
            if (ascension >= 4) {
                ctx.beginPath(); ctx.arc(0, 0, size * 2.8 + Math.sin(frame*0.1)*5, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 0, 85, 0.3)'; ctx.lineWidth = 10; ctx.stroke();
            }

            // Ascension 2: Äußerer schützender Stern
            if (ascension >= 2) {
                ctx.beginPath();
                for (let i = 0; i < 16; i++) {
                    const r = i % 2 === 0 ? size * 2.4 : size * 1.8; const a = (i * Math.PI) / 8 - frame * 0.008;
                    if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath(); ctx.strokeStyle = 'rgba(157, 78, 221, 0.6)'; ctx.lineWidth = 2; ctx.stroke();
            }

            // Shield
            if (player.shield > 0) {
                ctx.beginPath(); ctx.arc(0, 0, size * 1.35, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(157, 78, 221, 0.7)'; ctx.lineWidth = 3; ctx.shadowColor = '#9d4edd'; ctx.shadowBlur = 15; ctx.stroke();
            }

            // Ascension 1: Rotierende Tech Ringe
            if (ascension >= 1) {
                ctx.beginPath(); ctx.setLineDash([8, 12]);
                ctx.arc(0, 0, size * 1.6, frame * 0.03, Math.PI * 2 + frame * 0.03);
                ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
            }

            // Base Star
            ctx.shadowBlur = 20; ctx.shadowColor = '#00f3ff'; ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const r = i % 2 === 0 ? size : size * 0.38; const a = (i * Math.PI) / 4;
                if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            ctx.closePath();
            const grad = ctx.createLinearGradient(-size, -size, size, size); grad.addColorStop(0, '#00f3ff'); grad.addColorStop(1, '#9d4edd');
            ctx.strokeStyle = grad; ctx.lineWidth = 3.5; ctx.stroke();

            // Ascension 3: Fokus Dreiecke im Auge
            if (ascension >= 3) {
                ctx.save(); ctx.rotate(frame * 0.04); ctx.beginPath();
                ctx.moveTo(0, -size*0.7); ctx.lineTo(size*0.6, size*0.35); ctx.lineTo(-size*0.6, size*0.35); ctx.closePath();
                ctx.strokeStyle = '#ffbe0b'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
            }

            // Eye Center
            ctx.beginPath(); ctx.moveTo(-size * 0.48, 0); ctx.quadraticCurveTo(0, -size * 0.36, size * 0.48, 0); ctx.quadraticCurveTo(0, size * 0.36, -size * 0.48, 0);
            ctx.fillStyle = '#010103'; ctx.fill(); ctx.strokeStyle = grad; ctx.lineWidth = 2; ctx.stroke();
            
            // Pupil
            const target = getTargetCoordinates(); const dx = target.x - centerX; const dy = target.y - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1; const maxOffset = size * 0.16;
            const ix = (dx / dist) * Math.min(dist, maxOffset); const iy = (dy / dist) * Math.min(dist, maxOffset);
            
            // Goldene Pupille bei Ascension 5
            let irisColor = ascension >= 5 ? '#ffbe0b' : '#00f3ff';
            ctx.beginPath(); ctx.arc(ix, iy, size * 0.15, 0, Math.PI * 2); ctx.fillStyle = irisColor; ctx.shadowColor = irisColor; ctx.shadowBlur = 12; ctx.fill();
            ctx.beginPath(); ctx.arc(ix, iy, size * 0.065, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill(); ctx.restore();
        }

        function loop() {
            // Space Background
            ctx.fillStyle = 'rgba(1, 1, 3, 0.4)'; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#fff';
            for(let st of stars) {
                st.y += st.v; if (st.y > height) { st.y = 0; st.x = Math.random()*width; }
                ctx.globalAlpha = st.s * 0.5; ctx.fillRect(st.x, st.y, st.s, st.s);
            }
            ctx.globalAlpha = 1;

            if (isShattering) {
                shatterFrames++;
                let shakeX = (Math.random() - 0.5) * 25; let shakeY = (Math.random() - 0.5) * 25;
                ctx.save(); ctx.translate(shakeX, shakeY);
                drawTheCosmicEye(); // Eye glitching
                
                // Zersprungenes Glas
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath();
                for(let i=0; i<15; i++) { ctx.moveTo(centerX, centerY); ctx.lineTo(centerX + (Math.random()-0.5)*width*1.5, centerY + (Math.random()-0.5)*height*1.5); }
                ctx.stroke();
                
                if (Math.random() > 0.6) { ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(-width,-height,width*3,height*3); }
                ctx.restore();

                if (shatterFrames > 70) {
                    isShattering = false; ascension = getAscensionLevel(level);
                    addXP(300 + level*50); // XP nach dem Boss
                }
                animId = requestAnimationFrame(loop); return;
            }

            if (inCombat && !isPaused) {
                frame++;
                if (player.shield < player.maxShield) { player.shield = Math.min(player.maxShield, player.shield + player.regen); if (frame % 15 === 0) updateHUD(); }
                fireProjectiles();
                if (frame % Math.max(10, 45 - level * 3) === 0) spawnEnemy();

                if (boss) {
                    boss.angle += 0.02; boss.x = centerX + Math.sin(boss.angle) * (width * 0.28);
                    ctx.save(); ctx.translate(boss.x, boss.y); ctx.rotate(-boss.angle);
                    ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 4; ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 18;
                    ctx.strokeRect(-boss.rad, -boss.rad, boss.rad * 2, boss.rad * 2);
                    ctx.fillStyle = 'rgba(255,0,85,0.2)'; ctx.fillRect(-boss.rad, -boss.rad - 18, boss.rad * 2, 6);
                    ctx.fillStyle = '#ff0055'; ctx.fillRect(-boss.rad, -boss.rad - 18, (boss.rad * 2) * (boss.hp / boss.maxHp), 6);
                    ctx.restore();
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i]; const a = Math.atan2(centerY - e.y, centerX - e.x); e.x += Math.cos(a) * e.spd; e.y += Math.sin(a) * e.spd;
                    if (Math.hypot(e.x - centerX, e.y - centerY) < 34) { takeDamage(20); enemies.splice(i, 1); continue; }
                    ctx.fillStyle = 'rgba(255,0,85,0.3)'; ctx.fillRect(e.x - 12, e.y - 20, 24, 4); ctx.fillStyle = '#ff0055'; ctx.fillRect(e.x - 12, e.y - 20, 24 * (e.hp / e.maxHp), 4);
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.rad, 0, Math.PI * 2); ctx.fillStyle = '#ff0055'; ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 10; ctx.fill();
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i]; b.x += b.vx; b.y += b.vy; b.life--;
                    if (b.life <= 0) { bullets.splice(i, 1); continue; }
                    let hit = false;
                    if (boss && Math.hypot(b.x - boss.x, b.y - boss.y) < boss.rad + 6) {
                        boss.hp -= b.dmg; hit = true; playSound('hit');
                        if (boss.hp <= 0) { 
                            let bx = boss.x; let by = boss.y; boss = null; createExplosion(bx, by, '#ffbe0b', 50); 
                            
                            // Check Ascension Trigger
                            let nextAsc = getAscensionLevel(level);
                            if (nextAsc > ascension) { triggerShatter(); } else { addXP(300 + level*50); playSound('boss_spawn'); }
                        }
                    }
                    if (!hit) {
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            const e = enemies[j];
                            if (Math.hypot(b.x - e.x, b.y - e.y) < e.rad + 5) {
                                e.hp -= b.dmg; hit = true; playSound('hit'); createExplosion(b.x, b.y, '#00f3ff', 3);
                                if (e.hp <= 0) { enemies.splice(j, 1); addXP(15); createExplosion(e.x, e.y, '#ff0055', 8); } break;
                            }
                        }
                    }
                    if (hit) { bullets.splice(i, 1); continue; }
                    ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#00f3ff'; ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 8; ctx.fill();
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 10; ctx.globalAlpha = p.life / 35;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
                }
            }

            if (!isShattering) drawTheCosmicEye();
            animId = requestAnimationFrame(loop);
        }

        if (!playerName) document.getElementById('login-modal').style.display = 'flex'; else openHub();
        loop();
    </script>
</body>
